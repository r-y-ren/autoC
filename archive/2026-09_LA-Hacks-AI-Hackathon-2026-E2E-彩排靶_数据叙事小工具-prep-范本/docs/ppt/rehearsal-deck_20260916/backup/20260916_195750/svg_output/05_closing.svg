<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="ending"
     font-family="'Microsoft YaHei', 'Noto Sans SC', 'PingFang SC', Arial, sans-serif">
  <defs>
    <filter id="titleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
      <feFlood flood-color="#22D3EE" flood-opacity="0.35" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect id="bg-field" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B1220"/>
