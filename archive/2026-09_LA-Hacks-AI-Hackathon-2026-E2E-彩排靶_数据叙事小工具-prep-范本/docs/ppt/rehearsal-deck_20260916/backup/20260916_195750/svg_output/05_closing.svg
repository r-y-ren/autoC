    <text x="656" y="300" text-anchor="middle" font-size="64" font-weight="bold" fill="#E2E8F0" filter="url(#titleGlow)">作品<tspan fill="#22D3EE">即证据</tspan></text>
  </g>

  <g id="closing-sub" data-pptx-bounds="300 360 680 56">
