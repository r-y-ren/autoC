<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>无人机链路抗干扰测评台</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    /* 骨架样式：深色驾驶舱底（正式皮肤 fn-implement 阶段打磨） */
    body { margin: 0; background: #0e1420; color: #dbe4f0; font-family: system-ui, sans-serif; }
    .panel { border: 1px solid #263248; border-radius: 10px; padding: 12px; margin: 10px; }
    #estop { background: #c0392b; color: white; font-size: 1.4em; padding: 18px 32px; border: none; border-radius: 10px; }
  </style>
</head>
<body>
  <div id="app">
    <header class="panel"><h1>无人机链路抗干扰测评台</h1><span>{{ status }}</span></header>
    <section class="panel" id="anim-stage"><!-- 2D 示意动画层（anim.js 驱动，R13） --></section>
    <section class="panel" id="cockpit"><!-- 操控舱：样式选卡/功率滑杆/开始暂停（R11） --></section>
    <section class="panel" id="cards"><!-- 场景卡片一键测（R12） --></section>
    <section class="panel" id="dashboard"><!-- 实时曲线仪表盘（R11） --></section>
    <section class="panel" id="reports"><!-- 报告中心（R12） --></section>
    <button id="estop">急停</button>
  </div>
  <script src="app.js"></script>
  <script src="anim.js"></script>
</body>
</html>
