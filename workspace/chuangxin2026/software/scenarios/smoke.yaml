# R1 冒烟场景：单音 CW，短时，不接被测链路（干跑链路）
meta:
  name: smoke
  version: 1
dut:
  links: []            # 冒烟不接链路，仅验证生成链路
injection:
  styles: [cw]
  freq_hz: 2422000000
  bandwidth_hz: 1000
  params: {}
  power_start_db: -20
  power_step_db: 5
  power_stop_db: -15
  step_duration_s: 5
criteria:
  per_threshold: 0.10
  sustain_s: 10
  disconnect_s: 30
safety:
  max_tx_gain_db: 0    # 硬顶：TX 增益不许超过 0dB（屏蔽盒/传导环境口径）
record:
  sigmf: true
  ch2_monitor: false
