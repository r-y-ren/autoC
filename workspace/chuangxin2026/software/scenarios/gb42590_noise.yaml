# GB 42590-2023 §5.11 协议场景：噪声样式，干扰电平自被测链路发射功率 -5dB 起、5dB 步进至失效
meta:
  name: gb42590_noise
  version: 1
dut:
  links: [wifi, nrf24]
injection:
  styles: [noise_bandlimited]
  freq_hz: 2422000000
  bandwidth_hz: 20000000        # 带限噪声：99% 功率带宽 120–200% OCBW（EN 300 328 B.7 口径）
  params:
    flatness_target_db: 4       # 平坦度目标 ≤4dB（实现侧自检用）
  power_start_db: -5            # 相对被测链路发射功率（GB 42590 §5.11）
  power_step_db: 5
  power_stop_db: 40             # 安全上限档
  step_duration_s: 30
criteria:
  per_threshold: 0.10           # 失效判据：PER 持续 ≥10%（EN 300 328 判据量级）
  sustain_s: 10
  disconnect_s: 30
safety:
  max_tx_gain_db: 0
record:
  sigmf: true
  ch2_monitor: true
