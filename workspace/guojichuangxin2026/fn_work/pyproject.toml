[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anhang-yundun"
version = "0.1.0"
description = "安航云盾演示系统（乡村物流无人机主动安全）"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ['ahyd_cli', 'anhang_yundun.egg-info', 'batch_eval', 'bench_edge', 'boot_selfcheck', 'build_materials', 'build_package', 'calibrate_usrp', 'launch_demo_session', 'make_portable_bundle', 'run_device_bus', 'run_ground_station', 'run_ingest', 'run_link_consistency', 'run_progressive_risk', 'run_safety_state_machine', 'run_spectrum_monitor', 'run_sudden_fault', 'shared', 'soak_test']

[project.scripts]
ahyd-demo = "ahyd_cli.shims:demo_main"
ahyd-eval = "ahyd_cli.shims:eval_main"
ahyd-replay-check = "ahyd_cli.shims:replay_main"
ahyd-sdr-check = "ahyd_cli.shims:sdr_main"

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.npz"]
