[project]
name = "kagg3"
version = "0.1.0"
description = "Kaggriculture agent via OpenAI-ES over a JAX day-level simulator"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["kaggle-environments==1.32.7", "pytest>=8", "ruff>=0.6"]
gpu = ["jax[cuda12]>=0.4.35"]
cpu = ["jax>=0.4.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kagg3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
