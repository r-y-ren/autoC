  <g id="step-accept" data-pptx-bounds="860 336 320 264">
    <rect x="860" y="336" width="320" height="264" rx="6" fill="#111A2E" stroke="#1E293B" stroke-width="1"/>
    <circle cx="912" cy="392" r="24" fill="none" stroke="#22D3EE" stroke-width="2"/>
