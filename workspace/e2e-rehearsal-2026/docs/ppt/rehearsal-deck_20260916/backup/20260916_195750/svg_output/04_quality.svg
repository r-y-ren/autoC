    <circle cx="152" cy="392" r="24" fill="none" stroke="#22D3EE" stroke-width="2"/>
    <text x="152" y="402" text-anchor="middle" font-size="28" font-weight="bold" fill="#22D3EE" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace">1</text>
    <text x="196" y="402" font-size="30" font-weight="bold" fill="#E2E8F0">TDD 测试先行</text>
    <text x="132" y="466" font-size="22" fill="#94A3B8"><tspan x="132" dy="0">29 项单元测试全绿（a2）</tspan><tspan x="132" dy="36">红→绿两次留痕，先测后码</tspan><tspan x="132" dy="36">覆盖异常分支与核验器分支</tspan></text>
    <use data-icon="tabler-outline/circle-check" x="132" y="556" width="28" height="28" fill="#38BDF8" stroke-width="2"/>
  </g>

  <g id="step-gate" data-pptx-bounds="480 336 320 264">
    <rect x="480" y="336" width="320" height="264" rx="6" fill="#111A2E" stroke="#1E293B" stroke-width="1"/>
    <circle cx="532" cy="392" r="24" fill="none" stroke="#22D3EE" stroke-width="2"/>
    <text x="532" y="402" text-anchor="middle" font-size="28" font-weight="bold" fill="#22D3EE" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace">2</text>
    <text x="576" y="402" font-size="30" font-weight="bold" fill="#E2E8F0">波门验收左移</text>
    <text x="512" y="466" font-size="22" fill="#94A3B8"><tspan x="512" dy="0">波门早跑 a1/a2 双 PASS</tspan><tspan x="512" dy="36">scoped <tspan fill="#F59E0B">不烧熔断额度</tspan></tspan><tspan x="512" dy="36">重派 ≤1 次，波门即断点</tspan></text>
