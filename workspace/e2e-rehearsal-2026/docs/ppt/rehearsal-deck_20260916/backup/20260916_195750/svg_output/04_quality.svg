  <g id="page-footer" data-pptx-bounds="80 648 1120 40">
    <text x="640" y="676" text-anchor="middle" font-size="20" fill="#94A3B8">证据 · acceptance/run-2.json（result=pass）｜e2e-rehearsal-2026</text>
