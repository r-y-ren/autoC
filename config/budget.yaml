# 跑批预算与限速
# 注意：rate_limit / checkpoint 目前为【技能层（K-01）执行的约定，脚本未强制】——
# 规模扩大后将下沉到 sync 脚本实现。circuit_breaker.repair_max_retries 是 retry.max
# 的唯一事实来源（init_state.py 与 run_acceptance.py 均从此读取）。

schema_version: 1

run_budget:
  max_subagents_per_batch: 4       # T3-a 实测：并发 4（hunter×2+scraper×2）稳定
  max_wallclock_minutes: 60        # T3-a 实测：整波并行约 22min（最长单分片 cumcm ~21min/45 工具调用）
  checkpoint: queue                # 断点续跑语义由候选队列承载（活跃/processed/ 与拒绝台账），无独立进度文件

# T3-a 实测量级（2026-08-27，单方向）：
#   sync_tech 单次 5-6s；hunter 分片 190-411s（0.25M-0.45M tokens）；
#   scraper 分片 224-1242s（0.23M-1.34M tokens）——赛事条目分片是成本大头

quotas:                             # 跑批配额单一事实源（K-08 与 cron 提示引用此处，勿在别处另立数字）
  deep_run_per_direction:           # 全量深度跑批（每 3 天）
    tech_cards: 5                   # 每方向每跑批技术卡上限
    comp_entries: 3                 # 每方向每跑批赛事条目上限
    winners_shards: 1               # winners/patterns 年份分片上限（实测 8M tokens/片）

rate_limit:
  requests_per_second: 1           # 对外部站点礼貌限速
  same_host_interval_ms: 1500
  respect_robots_txt: true         # 遵守目标站点 robots 与 ToS，只抓公开信息

retry:
  max_attempts: 2                  # 单信源失败重试次数
  backoff_seconds: 5

circuit_breaker:
  repair_max_retries: 3            # 验收-修复回环熔断阈值（与 state.retry.max 同步）
  escalation: "停机并向用户报告失败证据，不得继续自动重试"
